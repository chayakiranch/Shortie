<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-page">
      <!-- Left Section -->
      <section class="login-left">
        <div class="login-logo">Shortie</div>

        <div class="left-content">
          <h1>Shorten links. Track performance. Grow smarter.</h1>
          <p>Short links, QR codes and campaign analytics in one dashboard.</p>
        </div>

        <div class="left-footer">Smart URL shortener and QR platform</div>
      </section>

      <!-- Right Section -->
      <section class="login-right">
        <div class="login-container">
          <h2>Log in</h2>
          <p class="login-description">
            Welcome back. Enter your details to open your dashboard.
          </p>

          <button class="google-button">Continue with Google</button>

          <div class="divider">
            <span></span>
            <p>or with email</p>
            <span></span>
          </div>

          <form id="loginForm">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />

            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Your password"
              required
            />

            <div class="forgot-password">
              <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">Log in</button>
          </form>

          <p class="signup-text">
            New to Shortie? <a href="signin.html">Create an account</a>
          </p>
        </div>
      </section>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000";

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch(`${API_URL}/api/auth/login`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email, password }),
            });

            const result = await response.json();

            if (!response.ok) {
              alert(result.detail || "Login failed");
              return;
            }

            sessionStorage.setItem("shortie_token", result.access_token);

            window.location.href = "Dashboard.html";
          } catch (error) {
            alert("Cannot connect to the server. Check your backend.");
          }
        });
    </script>
  </body>
</html>
