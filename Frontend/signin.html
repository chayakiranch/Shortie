<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signin</title>
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <div class="signup-page">
      <!-- Left Section -->
      <section class="signup-left">
        <a class="signup-logo" href="index.html">Shortie</a>

        <div class="signup-left-content">
          <h1>Shorten links. Track performance. Grow smarter.</h1>
          <p>Short links, QR codes and campaign analytics in one dashboard.</p>
        </div>

        <div class="signup-footer">Smart URL shortener and QR platform</div>
      </section>

      <!-- Right Section -->
      <section class="signup-right">
        <div class="signup-container">
          <h2>Create your account</h2>
          <p class="signup-description">
            Start free. Verify your email to activate your account.
          </p>

          <button
            type="button"
            id="googleCustomButton"
            class="google-custom-button"
          >
            <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.65 5.94c4.47-4.13 7.12-10.2 7.12-17.59Z"
              />
              <path
                fill="#FBBC05"
                d="M10.54 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.98-6.19Z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.47 0 11.9-2.13 15.86-5.86l-7.65-5.94c-2.12 1.42-4.84 2.27-8.21 2.27-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
              /></svg
            ><span>Continue with Google</span>
          </button>

          <div class="signup-divider">
            <span></span>
            <p>or with email</p>
            <span></span>
          </div>

          <form id="signupForm">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" placeholder="Your name" required />

            <label for="signup-email">Email</label>
            <input
              type="email"
              id="signup-email"
              placeholder="you@example.com"
              required
            />

            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup-password"
              placeholder="At least 8 characters"
              minlength="8"
              required
            />

            <div class="terms">
              <input type="checkbox" id="terms" required />
              <label for="terms">
                I agree to the Terms and Privacy Policy.
              </label>
            </div>

            <button type="submit" class="signup-button">Sign up free</button>
          </form>

          <p class="signin-text">
            Already have an account?
            <a href="login.html">Log in</a>
          </p>
        </div>
      </section>
    </div>

    <script src="config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      const API_URL = window.API_URL;
      let googleCodeClient = null;
      let googleReady = false;

      async function initializeGoogleSignIn() {
        const button = document.getElementById("googleCustomButton");
        if (!button) return;
        try {
          const response = await fetch(`${API_URL}/api/auth/google/config`);
          const config = await response.json();
          if (!response.ok || !config.enabled || !config.client_id) {
            button.hidden = true;
            return;
          }
          const waitForGoogle = () => {
            if (!window.google?.accounts?.oauth2) {
              window.setTimeout(waitForGoogle, 100);
              return;
            }
            googleCodeClient = google.accounts.oauth2.initCodeClient({
              client_id: config.client_id,
              scope: "openid email profile",
              ux_mode: "popup",
              callback: handleGoogleCode,
              error_callback: (error) => {
                console.error("Google sign-in popup error:", error);
                alert(
                  "Google sign-in was cancelled or could not start. Please try again.",
                );
              },
            });
            googleReady = true;
            button.disabled = false;
          };
          button.disabled = true;
          waitForGoogle();
        } catch (error) {
          console.error("Google sign-in initialization failed:", error);
          button.hidden = true;
        }
      }

      async function handleGoogleCode(response) {
        if (!response.code) {
          alert(
            "Google did not return an authorization code. Please try again.",
          );
          return;
        }
        const termsAccepted =
          document.getElementById("terms")?.checked ?? false;
        const isSignupPage = Boolean(document.getElementById("signupForm"));
        if (isSignupPage && !termsAccepted) {
          alert(
            "Please accept the Terms and Privacy Policy before continuing.",
          );
          return;
        }
        try {
          const authResponse = await fetch(`${API_URL}/api/auth/google/code`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              code: response.code,
              terms_accepted: termsAccepted,
            }),
          });
          const result = await authResponse.json();
          if (!authResponse.ok) {
            alert(result.detail || "Google sign-in failed");
            return;
          }
          sessionStorage.setItem("shortie_token", result.access_token);
          window.location.href = "Dashboard.html";
        } catch (error) {
          console.error("Google authentication request failed:", error);
          alert("Cannot connect to Shortie. Please try again.");
        }
      }

      document
        .getElementById("googleCustomButton")
        ?.addEventListener("click", () => {
          if (!googleReady || !googleCodeClient) {
            alert(
              "Google sign-in is still loading. Please try again in a moment.",
            );
            return;
          }
          googleCodeClient.requestCode();
        });

      initializeGoogleSignIn();

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const full_name = document.getElementById("fullname").value.trim();
          const email = document.getElementById("signup-email").value.trim();
          const password = document.getElementById("signup-password").value;
          const terms_accepted = document.getElementById("terms").checked;
          try {
            const response = await fetch(`${API_URL}/api/auth/signup`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                full_name,
                email,
                password,
                terms_accepted,
              }),
            });
            const result = await response.json();
            if (!response.ok) {
              alert(result.detail || "Sign-up failed");
              return;
            }
            alert("Account created successfully! Please log in.");
            window.location.href = "login.html";
          } catch (error) {
            console.error(error);
            alert("Cannot connect to Shortie. Check your backend.");
          }
        });
    </script>
  </body>
</html>
